<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO ARCA</title>

 <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="login.css">


</head>

<body>

    <div class="container-fluid d-flex justify-content-center justify-content-md-end align-items-center min-vh-100 p-0">

        <!-- METADE ESQUERDA: Texto customizado para CPF e Logo Superior Clicável -->
        <div class="col-12 col-md-5 metade-esquerda-fundo">
            <a href="index.html" class="logo-superior-esquerda">
                <img src="img/ARCA_LOGO.png" alt="Logo do Programa Arca">
            </a>
            
            <!-- Se você tiver os textos inseridos via HTML na coluna roxa, altere para o novo subtítulo: -->
            <!-- <p class="texto-secundario-fundo">Cadastre e faça parte dessa rede de solidariedade.</p> -->
        </div>

        <!-- METADE DIREITA: Formulário de Cadastro CPF -->
        <div class="col-12 col-md-7 metade-direita-login d-flex align-items-center justify-content-center p-4">

            <div class="card-login card-cadastro p-4 p-md-5 rounded-4 shadow-lg text-center">

                <!-- Botão Superior "Já possui uma conta? Entrar" -->
                <div class="d-flex justify-content-end align-items-center mb-3 gap-2 header-cadastro">
                    <span class="small text-muted">Já possui uma conta?</span>
                    <a href="login.html" class="btn btn-outline-purple btn-sm rounded-pill px-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                    </a>
                </div>

                <!-- Ícone da Patinha Central -->
                <div class="logo-login mx-auto mb-3">
                    <img src="img/patafundo.png" alt="Logo Patinha">
                </div>

                <h2 class="titulo-login mb-1">Cadastre-se</h2>
                <p class="subtitulo-login mb-4">Preencha os dados da sua organização para criar sua conta</p>

                <form>
                    <!-- SEÇÃO: Tipo de Cadastro (Radio Buttons - CPF selecionado por padrão) -->
                    <div class="mb-4 text-start">
                        <label class="form-label label-custom d-block">Tipo de cadastro</label>
                        <div class="form-check form-check-inline me-4">
                            <input class="form-check-input radio-custom" type="radio" name="tipoCadastro" id="pf" value="PF" checked onclick="irParaCadastro('pf')">
                            <label class="form-check-label label-radio" for="pf">Pessoa física (CPF)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input radio-custom" type="radio" name="tipoCadastro" id="pj" value="PJ" onclick="irParaCadastro('pj')">
                            <label class="form-check-label label-radio" for="pj">Pessoa Jurídica / ONG (CNPJ)</label>
                        </div>
                    </div>

                    <!-- LINHA 1: Nome Completo e CPF -->
                    <div class="row g-3 mb-3 text-start">
                        <div class="col-12 col-md-6">
                            <label for="nomeCompleto" class="form-label label-custom">Nome completo</label>
                            <input type="text" id="nomeCompleto" class="form-control input-custom-clean" placeholder="Digite seu nome completo" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="cpf" class="form-label label-custom">CPF</label>
                            <input type="text" id="cpf" class="form-control input-custom-clean" placeholder="000.000.000-00" required>
                        </div>
                    </div>

                    <!-- LINHA 2: E-mail e Telefone -->
                    <div class="row g-3 mb-3 text-start">
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label label-custom">E-mail</label>
                            <input type="email" id="email" class="form-control input-custom-clean" placeholder="Digite seu e-mail" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="telefone" class="form-label label-custom">Telefone</label>
                            <input type="tel" id="telefone" class="form-control input-custom-clean" placeholder="(00) 00000-0000" required>
                        </div>
                    </div>

                    <!-- LINHA 3: CEP (Com ícone de lupa) e Bairro -->
                    <div class="row g-3 mb-3 text-start">
                        <div class="col-12 col-md-6">
                            <label for="cep" class="form-label label-custom">CEP</label>
                            <div class="position-relative d-flex align-items-center">
                                <input type="text" id="cep" class="form-control input-custom-clean pe-5" placeholder="00000-000" required>
                                <i class="bi bi-search position-absolute" style="right: 15px; color: #a0a0a0; cursor: pointer;"></i>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="bairro" class="form-label label-custom">Bairro</label>
                            <input type="text" id="bairro" class="form-control input-custom-clean" placeholder="Digite seu bairro" required>
                        </div>
                    </div>

                    <!-- LINHA 4: Rua e Número -->
                    <div class="row g-3 mb-3 text-start">
                        <div class="col-12 col-md-6">
                            <label for="rua" class="form-label label-custom">Rua</label>
                            <input type="text" id="rua" class="form-control input-custom-clean" placeholder="Digite sua rua" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="numero" class="form-label label-custom">Número</label>
                            <input type="text" id="numero" class="form-control input-custom-clean" placeholder="Digite o número da residência" required>
                        </div>
                    </div>

                    <!-- LINHA 5: Senha e Confirmar Senha -->
                    <div class="row g-3 mb-3 text-start">
                        <div class="col-12 col-md-6">
                            <label for="senha" class="form-label label-custom">Senha</label>
                            <div class="position-relative">
                                <input type="password" id="senha" class="form-control input-custom-clean pe-5" placeholder="Crie uma senha segura" required>
                                <i class="bi bi-eye-slash icon-senha-toggle"></i>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="confirmarSenha" class="form-label label-custom">Confirmar senha</label>
                            <div class="position-relative">
                                <input type="password" id="confirmarSenha" class="form-control input-custom-clean pe-5" placeholder="Confirme sua senha" required>
                                <i class="bi bi-eye-slash icon-senha-toggle"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Alerta de Requisitos da Senha -->
                    <div class="alert-senha mb-4 text-start p-2 rounded-3 d-flex align-items-center gap-2">
                        <i class="bi bi-shield-lock-fill"></i>
                        <span>Sua senha deve conter pelo menos 8 caracteres, incluindo letras e números</span>
                    </div>

                    <!-- Botão de Cadastro Finalizado -->
                    <button type="submit" class="btn btn-entrar btn-entrar-curto rounded-pill py-2 mb-2 d-flex align-items-center justify-content-center gap-2 mx-auto">
                        <i class="bi bi-person-plus"></i> Criar minha conta
                    </button>
                </form>

            </div>
        </div>
    </div>

    <!-- Script de controle de tipo de cadastro (Invertido para monitorar a volta para PJ) -->
    <script>
        function irParaCadastro(tipo) {
            if (tipo === 'pf') {
                window.location.href = 'cadastro-pf.html';
            } else if (tipo === 'pj') {
                window.location.href = 'cadastro.html'; // Retorna para a página de ONG
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
